name: Materialize binary assets

# GitHub's file API stores UTF-8 text. JPEG/PDF/ZIP bytes cannot travel that
# path, so the repo keeps base64 sidecars and this workflow writes the real files.
on:
  push:
    paths:
      - "assets-b64/**"
      - ".github/workflows/materialize-binaries.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Decode JPEG, PDF, and source zip
        run: |
          set -euo pipefail
          mkdir -p public attachments assets-b64/parts

          decode_parts() {
            local dest="$1"
            shift
            local missing=0
            local f
            for f in "$@"; do
              if [ ! -f "$f" ]; then
                echo "missing $f"
                missing=1
              fi
            done
            if [ "$missing" -ne 0 ]; then
              echo "skip $dest (sidecar parts not complete yet)"
              return 0
            fi
            cat "$@" | base64 -d > "$dest"
            echo "wrote $dest ($(wc -c < "$dest") bytes)"
          }

          decode_parts public/og.jpg \
            assets-b64/parts/og-00 assets-b64/parts/og-01 assets-b64/parts/og-02 \
            assets-b64/parts/og-03 assets-b64/parts/og-04 assets-b64/parts/og-05 \
            assets-b64/parts/og-06 assets-b64/parts/og-07 assets-b64/parts/og-08

          decode_parts public/x-banner.jpg \
            assets-b64/parts/xb-00 assets-b64/parts/xb-01 assets-b64/parts/xb-02 \
            assets-b64/parts/xb-03 assets-b64/parts/xb-04

          decode_parts attachments/CoDA-Synth_Traditional_ML_Colab_Guide.pdf \
            assets-b64/parts/pdf-00 assets-b64/parts/pdf-01 assets-b64/parts/pdf-02 \
            assets-b64/parts/pdf-03 assets-b64/parts/pdf-04

          python3 - <<'PY'
          from pathlib import Path
          pdf = Path("attachments/CoDA-Synth_Traditional_ML_Colab_Guide.pdf")
          assert pdf.exists(), "PDF sidecar failed to decode"
          data = pdf.read_bytes()
          assert data.startswith(b"%PDF"), data[:8]
          print("pdf ok", len(data))
          for p, magic in [("public/og.jpg", b"\xff\xd8\xff"), ("public/x-banner.jpg", b"\xff\xd8\xff")]:
              f = Path(p)
              if f.exists():
                  b = f.read_bytes()
                  assert b.startswith(magic), (p, b[:8])
                  print("jpg ok", p, len(b))
              else:
                  print("jpg skip", p)
          PY
          rm -f public/coda-synth-github.zip
          zip -r public/coda-synth-github.zip . \
            -x '.git/*' \
            -x '.git/**' \
            -x 'public/coda-synth-github.zip' \
            -x 'node_modules/*' \
            -x 'node_modules/**' \
            -x 'dist/*' \
            -x '.output/*'
          python3 - <<'PY'
          from pathlib import Path
          z = Path("public/coda-synth-github.zip").read_bytes()
          assert z[:2] == b"PK", z[:8]
          print("zip ok", len(z))
          PY
      - name: Commit binaries if they changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f attachments/CoDA-Synth_Traditional_ML_Colab_Guide.pdf \
            public/coda-synth-github.zip || true
          [ -f public/og.jpg ] && git add -f public/og.jpg || true
          [ -f public/x-banner.jpg ] && git add -f public/x-banner.jpg || true
          if git diff --cached --quiet; then
            echo "No binary changes"
          else
            git commit -m "Add methods PDF, share cards, and source zip"
            git push
          fi
