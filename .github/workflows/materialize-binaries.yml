name: Materialize binary assets

# GitHub's file API stores UTF-8 text. JPEG/PDF/ZIP bytes cannot travel that
# path, so the repo keeps base64 sidecars and this workflow writes the real files.
# It also concatenates docs/01–03 into README.md so the home page has the
# full Colab-style methods chapter.
on:
  push:
    paths:
      - "assets-b64/**"
      - "docs/01-overview.md"
      - "docs/02-method.md"
      - "docs/03-colab-and-report.md"
      - "scripts/assemble-readme.py"
      - ".github/workflows/materialize-binaries.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Assemble README from docs/01–03
        run: python3 scripts/assemble-readme.py
      - name: Decode JPEG, PDF, and source zip
        run: |
          set -euo pipefail
          mkdir -p public attachments
          cat assets-b64/parts/og-00 assets-b64/parts/og-01 assets-b64/parts/og-02 \
              assets-b64/parts/og-03 assets-b64/parts/og-04 assets-b64/parts/og-05 \
              assets-b64/parts/og-06 assets-b64/parts/og-07 assets-b64/parts/og-08 \
            | base64 -d > public/og.jpg
          cat assets-b64/parts/xb-00 assets-b64/parts/xb-01 assets-b64/parts/xb-02 \
              assets-b64/parts/xb-03 assets-b64/parts/xb-04 \
            | base64 -d > public/x-banner.jpg
          cat assets-b64/parts/pdf-00 assets-b64/parts/pdf-01 assets-b64/parts/pdf-02 \
              assets-b64/parts/pdf-03 assets-b64/parts/pdf-04 \
            | base64 -d > attachments/CoDA-Synth_Traditional_ML_Colab_Guide.pdf
          python3 - <<'PY'
          from pathlib import Path
          og = Path("public/og.jpg").read_bytes()
          xb = Path("public/x-banner.jpg").read_bytes()
          pdf = Path("attachments/CoDA-Synth_Traditional_ML_Colab_Guide.pdf").read_bytes()
          assert og[:3] == b"\xff\xd8\xff", og[:8]
          assert xb[:3] == b"\xff\xd8\xff", xb[:8]
          assert pdf.startswith(b"%PDF"), pdf[:8]
          print("decoded ok", len(og), len(xb), len(pdf))
          PY
          rm -f public/coda-synth-github.zip
          zip -r public/coda-synth-github.zip . \
            -x '.git/*' \
            -x '.git/**' \
            -x 'public/coda-synth-github.zip' \
            -x 'node_modules/*' \
            -x 'node_modules/**' \
            -x 'dist/*' \
            -x '.output/*'
          python3 - <<'PY'
          from pathlib import Path
          z = Path("public/coda-synth-github.zip").read_bytes()
          assert z[:2] == b"PK", z[:8]
          print("zip ok", len(z))
          PY
      - name: Commit binaries and README if they changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f README.md public/og.jpg public/x-banner.jpg \
            attachments/CoDA-Synth_Traditional_ML_Colab_Guide.pdf \
            public/coda-synth-github.zip
          if git diff --cached --quiet; then
            echo "No binary or README changes"
          else
            git commit -m "Assemble README methods chapter and refresh binary assets"
            git push
          fi
